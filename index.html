<!doctype html><html lang="ja"><head><meta charset="utf-8">

<script>/* 表示の設定（テーマ・アクセントカラー）を、画面を描く前に当てる */
try { var t = localStorage.getItem("cg-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  var a = localStorage.getItem("cg-accent"); if (a) document.documentElement.style.setProperty("--sky", a); } catch (e) {}</script>
</head><body>
<div class="top">
  <svg class="waves" viewBox="0 0 1440 520" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0H760C640 60 560 40 470 110C360 196 220 150 120 230C60 278 30 320 0 330Z" fill="var(--wash)"/>
    <path d="M0 0H420C330 40 260 30 190 90C120 150 60 140 0 190Z" fill="var(--wash2)"/>
    <path d="M1440 520H900C1000 470 1080 490 1160 430C1250 362 1340 380 1440 300Z" fill="var(--wash)"/>
  </svg>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><img class="logo lg-c" src="icons/logo-c.png" alt="Cheers mate"><img class="logo lg-w" src="icons/logo-w.png" alt=""><span class="goname">チアーズ<b>GO!</b><i>BETA</i></span></div>
      <span class="hd-r"><span class="asof" id="asof"></span><button type="button" class="gear bell" id="bell" aria-label="今日まだの項目" aria-expanded="false" aria-controls="bellPanel" hidden><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="bdg num" id="bellN" hidden></span></button><button type="button" class="gear" id="gear" aria-label="表示の設定" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></span>
    </div>
  </div>
</div>
<div class="setpanel" id="setPanel" hidden>
  <div class="sp-row"><b>テーマ</b><div class="kzrate wide" role="group" aria-label="テーマ"><button type="button" data-th="auto">自動</button><button type="button" data-th="light">ライト（白）</button><button type="button" data-th="dark">ダーク</button></div></div>
  <div class="sp-row"><b>アクセントの色</b><div class="accents" role="group" aria-label="アクセントの色"></div></div>
  <p class="mapnote">「自動」は、端末のダークモードに合わせます。</p>
  <div class="sp-row" id="spRemind" hidden></div>
  <div class="sp-row" id="spGuide" hidden></div>
</div>
<div class="setpanel bellpanel" id="bellPanel" role="region" aria-label="今日まだの項目" hidden></div>
<div class="demobar" id="demoBar" hidden>デモ表示中：架空の人・架空の写真です。<a href="./">デモを終わる</a></div>
<nav class="tabs gotabs" id="tabs">
  <div class="in" role="tablist" aria-label="ページの切り替え">
    <button type="button" role="tab" id="tab-me" aria-selected="false" aria-controls="pane-me" hidden><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
    <button type="button" role="tab" id="tab-kz" aria-selected="false" aria-controls="pane-kz" hidden><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>練習</span></button>
    <button type="button" role="tab" id="tab-go" aria-selected="false" aria-controls="pane-go"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg><span>冒険</span></button>
    <button type="button" role="tab" id="tab-us" aria-selected="true" aria-controls="pane-us"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c.8-3.6 3.2-5.6 6-5.6s5.2 2 6 5.6M15 14.6c2.6 0 4.8 1.6 5.6 4.6"/></svg><span>みんな</span></button>
    <button type="button" role="tab" id="tab-my" aria-selected="false" aria-controls="pane-my" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4.4 4.2-6.6 8-6.6s6.8 2.2 8 6.6"/></svg><span>マイ</span></button>
  </div>
</nav>

<main>
  <div class="pane" id="pane-me" role="tabpanel" aria-labelledby="tab-me" hidden><div class="wrap" id="me"><p class="loading">あなたのページを読み込んでいます…</p></div></div>
  <div class="pane" id="pane-kz" role="tabpanel" aria-labelledby="tab-kz" hidden><div class="wrap"><div class="segbar" id="kzSeg" role="group" aria-label="練習の切り替え"></div><section id="kzwrap"></section></div></div>
  <div class="pane" id="pane-go" role="tabpanel" aria-labelledby="tab-go" hidden><div class="wrap"><div class="segbar" id="goSeg" role="group" aria-label="冒険の切り替え"></div>
    <section id="mapwrap"></section><section id="dexwrap" hidden></section><section id="questwrap" hidden></section></div></div>
  <div class="pane" id="pane-us" role="tabpanel" aria-labelledby="tab-us">
    <div class="wrap">
      <div class="gate" id="gate" hidden>
        <div><b>チアーズGO!（ベータ版）</b><p>あなた専用のページは、運営から届いたリンクで開けます。リンクで1回開けば、次からはホーム画面のアイコンからそのまま開けます。</p></div>
        <a class="btn" href="#demo">デモで全部の機能を見る</a>
      </div>
    </div>
    <div class="wrap" id="us"></div>
  </div>
  <div class="pane" id="pane-my" role="tabpanel" aria-labelledby="tab-my" hidden><div class="wrap" id="my"></div></div>
</main>

<footer><b>Cheers mate</b><br>世界中に乾杯できる仲間を。Discordの投稿とチアーズPHOTOから作っています（ベータ版）。<br><a href="./" id="logout">この端末からあなたのリンクを消す</a></footer>

  <button class="x" id="dlgX" type="button" aria-label="閉じる">×</button>
  <div class="dlg">
    <div class="pic"><img id="dImg" alt=""></div>
    <div class="info">
      <div class="no" id="dNo"></div>
      <h3 id="dDate"></h3>
      <div class="ccs" id="dCc"></div>
      <dl id="dDl"></dl>
      <div class="nav"><button type="button" id="dPrev">← 前の1枚</button><button type="button" id="dNext">次の1枚 →</button></div>
    </div>
  </div>
</dialog>
